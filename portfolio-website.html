<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Personal professional portfolio website">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Professional Portfolio">
  <meta property="og:description" content="Personal portfolio and engineering showcase">
  <title>Professional Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-subtle: #f1f5f9;
      --line: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #334155;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-hover: #1d4ed8;
      --accent-border: #bfdbfe;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 24px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.09);
      --radius: 16px;
    }

    /* Warm Editorial Theme */
    body.warm {
      --bg: #fbf4e9;
      --card: #fffaf3;
      --card-subtle: #f4ecdf;
      --line: #ebdcca;
      --text: #35291f;
      --text-secondary: #524134;
      --muted: #78695d;
      --muted-light: #9c8e80;
      --accent: #c25e36;
      --accent-light: #fef4ed;
      --accent-hover: #a84824;
      --accent-border: #f7d2bf;
    }

    /* Clean Monochrome Minimal Theme */
    body.minimal {
      --bg: #ffffff;
      --card: #f9f9f9;
      --card-subtle: #f0f0f0;
      --line: #e5e5e5;
      --text: #171717;
      --text-secondary: #383838;
      --muted: #737373;
      --muted-light: #a3a3a3;
      --accent: #171717;
      --accent-light: #f5f5f5;
      --accent-hover: #000000;
      --accent-border: #d4d4d4;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s, color 0.25s;
    }

    a { color: inherit; text-decoration: none; }
    .container { width: min(1140px, 88%); margin: auto; }

    /* Navigation Bar */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(248, 250, 252, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      transition: background 0.2s;
    }
    body.warm .nav-wrap { background: rgba(251, 244, 233, 0.9); }
    body.minimal .nav-wrap { background: rgba(255, 255, 255, 0.92); }

    .nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-weight: 850;
      letter-spacing: -0.02em;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
    }
    .logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    .links {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .links a {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .links a:hover { color: var(--accent); }
    .nav-cta {
      background: var(--accent) !important;
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: 700 !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: transform 0.15s, background 0.15s !important;
    }
    .nav-cta:hover {
      background: var(--accent-hover) !important;
      transform: translateY(-1px);
    }

    /* Hero Section */
    .hero {
      min-height: 580px;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      align-items: center;
      gap: 60px;
      padding: 70px 0 60px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      font-weight: 800;
      font-size: 12px;
      background: var(--accent-light);
      border: 1px solid var(--accent-border);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .hero h1 {
      font-size: clamp(38px, 5.5vw, 68px);
      line-height: 1.06;
      letter-spacing: -0.04em;
      margin: 0 0 20px;
      color: var(--text);
      font-weight: 900;
    }
    .hero h1 span {
      color: var(--accent);
    }
    .lead {
      font-size: 18px;
      color: var(--muted);
      max-width: 620px;
      margin: 0 0 32px;
      line-height: 1.65;
    }
    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      padding: 12px 22px;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.18s ease;
    }
    .btn-main {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    .btn-main:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }
    .btn-alt {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-alt:hover {
      background: var(--card-subtle);
      border-color: #cbd5e1;
    }

    .portrait-wrap {
      display: flex;
      justify-content: center;
    }
    .portrait {
      width: min(340px, 100%);
      aspect-ratio: 1;
      border-radius: 28px;
      background: linear-gradient(145deg, var(--accent-light), #dbeafe);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 76px;
      font-weight: 950;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sections */
    section { padding: 65px 0; border-top: 1px solid var(--line); }
    .section-label {
      color: var(--accent);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 36px;
    }
    .section-head h2 {
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 8px 0 0;
      color: var(--text);
      font-weight: 850;
    }
    .section-head p {
      color: var(--muted);
      max-width: 440px;
      margin: 0;
      font-size: 14px;
    }

    /* About & Facts */
    .about-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: start;
    }
    .about-copy {
      font-size: 20px;
      line-height: 1.65;
      margin: 0;
      color: var(--text-secondary);
      font-weight: 450;
    }
    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .fact {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 18px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .fact small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }
    .fact strong {
      display: block;
      margin-top: 5px;
      font-size: 15px;
      color: var(--text);
      font-weight: 700;
    }

    /* Skills */
    .skills { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .skill:hover {
      border-color: var(--accent-border);
      background: var(--accent-light);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Academic Highlights / Student Section */
    .student-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .student-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .student-card.wide { grid-column: span 2; }
    .student-card small {
      color: var(--accent);
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
    }
    .student-card h3 {
      margin: 8px 0 6px;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .student-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .clean-list {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
    }
    .clean-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      color: var(--text-secondary);
      font-size: 13px;
    }
    .clean-list li:last-child { border: 0; }

    /* Timeline / Experience */
    .timeline {
      border-left: 2px solid var(--line);
      margin-left: 12px;
      padding-left: 32px;
    }
    .role {
      position: relative;
      padding-bottom: 38px;
    }
    .role:last-child { padding-bottom: 0; }
    .role:before {
      content: "";
      position: absolute;
      left: -39px;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-light);
    }
    .role h3 {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      color: var(--text);
    }
    .role-meta {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      margin: 4px 0 10px;
    }
    .role p {
      color: var(--muted);
      margin: 0;
      max-width: 720px;
      font-size: 14px;
      line-height: 1.65;
    }

    /* Projects */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .project {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow-sm);
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
    }
    .project:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-border);
    }
    .project-num {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .project h3 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 10px;
      color: var(--text);
    }
    .project p {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.6;
      flex: 1;
    }
    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .tag {
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--muted);
      background: var(--card-subtle);
      font-weight: 600;
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      font-weight: 750;
      font-size: 13px;
      text-decoration: none;
      transition: gap 0.15s ease;
    }
    .project-link:hover {
      gap: 10px;
    }

    /* Contact Card */
    .contact {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .contact h2 {
      font-size: clamp(32px, 5vw, 54px);
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin: 12px auto 16px;
      max-width: 740px;
      color: var(--text);
      font-weight: 900;
    }
    .contact p {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 32px;
      font-size: 15px;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .socials a {
      border: 1px solid var(--line);
      background: var(--card-subtle);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .socials a:hover {
      background: var(--accent-light);
      border-color: var(--accent-border);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Footer */
    .footer {
      padding: 32px 0 42px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      align-items: center;
    }

    /* Loading & 404 Empty States */
    .loading-state, .empty-state {
      min-height: 80vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      box-shadow: var(--shadow-md);
    }
    .empty-card h1 {
      font-size: 24px;
      font-weight: 850;
      margin: 0 0 10px;
      color: var(--text);
    }
    .empty-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }

    /* Responsive Queries */
    @media(max-width: 860px) {
      .links a:not(.nav-cta) { display: none; }
      .hero { grid-template-columns: 1fr; gap: 40px; padding: 50px 0; }
      .portrait-wrap { order: -1; }
      .portrait { max-width: 260px; }
      .about-grid, .project-grid, .student-grid { grid-template-columns: 1fr; gap: 24px; }
      .student-card.wide { grid-column: auto; }
      .section-head { flex-direction: column; align-items: flex-start; gap: 8px; }
      .contact { padding: 40px 20px; }
      .footer { flex-direction: column; gap: 10px; text-align: center; }
    }
  </style>
</head>
<body>
  <!-- Navigation Header -->
  <header class="nav-wrap">
    <nav class="container nav">
      <a class="logo" href="#" id="logo">
        <span class="logo-dot"></span>
        <span id="logoText">Portfolio</span>
      </a>
      <div class="links">
        <a href="#about">About</a>
        <a href="#skillsSection">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#work">Projects</a>
        <a href="#contact" class="nav-cta" id="navCtaBtn">Get in Touch</a>
      </div>
    </nav>
  </header>

  <!-- Main Dynamic Content -->
  <main id="content">
    <div class="loading-state" id="loadingState">
      <div>
        <div class="spinner"></div>
        <p style="color:var(--muted); font-size:14px; font-weight:500;">Loading verified portfolio…</p>
      </div>
    </div>
  </main>

  <footer class="container footer" id="footer" style="display:none">
    <span id="copyright">© 2026 Portfolio</span>
    <span>Powered by <strong style="color:var(--accent)">PortfolioAI</strong></span>
  </footer>

  <script>
    const esc = (v = '') => String(v).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function dateRange(a, b) {
      const format = x => {
        if (!x) return '';
        const d = new Date(x + '-02');
        return isNaN(d.getTime()) ? x : d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
      };
      return [format(a), b ? format(b) : 'Present'].filter(Boolean).join(' – ');
    }

    function initials(n = '') {
      return n.trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase() || 'YOU';
    }

    function safeUrl(url) {
      if (!url) return '';
      try {
        const u = new URL(url, location.href);
        return ['http:', 'https:', 'mailto:', 'tel:'].includes(u.protocol) ? u.href : '';
      } catch {
        return '';
      }
    }

    // Extract slug from path (e.g. /portfolio/maya-sharma-a8f3x) or URL search parameters
    function getRequestedSlug() {
      const pathMatch = window.location.pathname.match(/\/portfolio\/([^/?#]+)/i);
      if (pathMatch && pathMatch[1] && pathMatch[1] !== 'portfolio-website.html') {
        return decodeURIComponent(pathMatch[1].trim());
      }
      const params = new URLSearchParams(window.location.search);
      return params.get('slug') || params.get('id');
    }

    async function loadPortfolio() {
      const slug = getRequestedSlug();

      if (!slug) {
        // Attempt local storage fallback if opened directly without query/slug
        const localData = localStorage.getItem('portfolioData');
        if (localData) {
          try {
            render(JSON.parse(localData));
            return;
          } catch(e) {}
        }
        showNotFound('No portfolio specified. Please create or open a portfolio with a valid permanent link.');
        return;
      }

      try {
        // Fetch from permanent backend database
        const res = await fetch(`/api/portfolios/${encodeURIComponent(slug)}`);
        if (res.ok) {
          const json = await res.json();
          if (json.success && json.data) {
            render(json.data);
            return;
          }
        }
        
        // If not found in DB, check local storage backup
        const cached = localStorage.getItem(`portfolio_${slug}`) || localStorage.getItem('portfolioData');
        if (cached) {
          try {
            render(JSON.parse(cached));
            return;
          } catch (e) {}
        }

        showNotFound('The requested portfolio was not found in the database. Please verify the URL or create a new portfolio.');
      } catch (err) {
        console.warn('Backend fetch failed, attempting local fallback:', err);
        const cached = localStorage.getItem(`portfolio_${slug}`) || localStorage.getItem('portfolioData');
        if (cached) {
          try {
            render(JSON.parse(cached));
            return;
          } catch (e) {}
        }
        showNotFound('Could not connect to the backend server. Make sure the PortfolioAI server is running on http://localhost:5000.');
      }
    }

    function showNotFound(message) {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="empty-card">
            <div style="font-size:36px; margin-bottom:12px">🔍</div>
            <h1>Portfolio Not Found</h1>
            <p>${esc(message)}</p>
            <a href="portfolio-generator.html" class="btn btn-main">Build Your Portfolio</a>
          </div>
        </div>`;
    }

    function render(d) {
      const p = d.personalInfo || {};
      const s = d.student || {};
      const a = d.about || {};
      const settings = d.settings || {};
      const skills = d.skills || [];
      const exp = d.experience || [];
      const edu = d.education || [];
      const projects = d.projects || [];

      // Set Theme class
      document.body.className = settings.theme === 'warm' ? 'warm' : settings.theme === 'minimal' ? 'minimal' : '';

      // SEO & Social Tags
      const pageTitle = `${p.fullName || 'Candidate'} — ${p.title || 'Professional Portfolio'}`;
      document.title = pageTitle;
      const descMeta = document.querySelector('meta[name=description]');
      if (descMeta) descMeta.content = a.summary || `Explore ${p.fullName || 'candidate'}'s engineering portfolio.`;
      
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.content = pageTitle;

      // Nav Logo
      document.getElementById('logoText').textContent = p.fullName || 'Portfolio';

      // Assemble Main HTML
      const mainHtml = `
        <!-- Hero Section -->
        <header class="container hero">
          <div>
            <div class="eyebrow">
              <span class="eyebrow-dot"></span>
              <span>${esc(s.availability || p.location || 'Available for Opportunities')}</span>
            </div>
            <h1>${formatHeadline(a.tagline || `Hi, I’m ${p.fullName || 'Your Name'}.`)}</h1>
            <p class="lead">${esc(a.summary || `I’m a ${p.title || 'developer'} focused on thoughtful engineering and real impact.`)}</p>
            <div class="actions">
              <a class="btn btn-main" href="${p.email ? `mailto:${encodeURIComponent(p.email)}` : '#contact'}">${esc(settings.cta || 'Let’s work together')}</a>
              <a class="btn btn-alt" href="#work">View Projects</a>
            </div>
          </div>
          <div class="portrait-wrap">
            <div class="portrait">
              ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.fullName)}">` : esc(initials(p.fullName))}
            </div>
          </div>
        </header>

        <!-- About Section -->
        <section id="about">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="section-label">Overview</div>
                <h2>Professional Story</h2>
              </div>
              <p>A snapshot of my background, focus areas, and working philosophy.</p>
            </div>
            <div class="about-grid">
              <p class="about-copy">${esc(a.summary || 'I combine engineering craft, clear communication, and analytical thinking to build reliable digital systems.')}</p>
              <div class="facts">
                ${renderFacts(p, s, settings)}
              </div>
            </div>
          </div>
        </section>

        <!-- Skills Section -->
        ${skills.filter(x => x.name).length ? `
        <section id="skillsSection">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="section-label">Core Capabilities</div>
                <h2>Skills & Technologies</h2>
              </div>
              <p>Technologies, frameworks, and tools applied in production and projects.</p>
            </div>
            <div class="skills">
              ${skills.filter(x => x.name).map(x => `<span class="skill">${esc(x.name)}</span>`).join('')}
            </div>
          </div>
        </section>` : ''}

        <!-- Academic & Student Highlights (if present) -->
        ${renderStudentSection(s, a)}

        <!-- Experience & Career Journey -->
        ${renderExperienceSection(exp, edu)}

        <!-- Featured Projects -->
        ${projects.filter(x => x.name).length ? `
        <section id="work">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="section-label">Portfolio Work</div>
                <h2>Featured Projects</h2>
              </div>
              <p>A curated selection of applications and solutions designed for real-world impact.</p>
            </div>
            <div class="project-grid">
              ${projects.filter(x => x.name).map((x, i) => {
                const href = safeUrl(x.link || x.github);
                return `
                  <article class="project">
                    <div class="project-num">0${i + 1}</div>
                    <h3>${esc(x.name)}</h3>
                    <p>${esc(x.description || 'A focused project created to solve a meaningful technical problem.')}</p>
                    <div class="tags">
                      ${String(x.technologies || 'Full Stack').split(',').filter(Boolean).map(t => `<span class="tag">${esc(t.trim())}</span>`).join('')}
                    </div>
                    ${href ? `<a class="project-link" href="${esc(href)}" target="_blank" rel="noopener">Explore Project →</a>` : ''}
                  </article>`;
              }).join('')}
            </div>
          </div>
        </section>` : ''}

        <!-- Contact Section -->
        <section id="contact">
          <div class="container contact">
            <div class="section-label">Get in Touch</div>
            <h2>${esc(settings.cta || 'Let’s create something worthwhile.')}</h2>
            <p>Have an open role, collaboration opportunity, or question? Feel free to reach out directly.</p>
            <div class="socials">
              ${renderSocials(p)}
            </div>
          </div>
        </section>
      `;

      document.getElementById('content').innerHTML = mainHtml;
      
      // Footer
      document.getElementById('copyright').textContent = `© ${new Date().getFullYear()} ${p.fullName || 'Portfolio'}`;
      document.getElementById('footer').style.display = 'flex';
      
      const navCta = document.getElementById('navCtaBtn');
      if (navCta) {
        navCta.href = p.email ? `mailto:${encodeURIComponent(p.email)}` : '#contact';
      }
    }

    function formatHeadline(headline) {
      const words = headline.split(' ');
      if (words.length <= 1) return esc(headline);
      const last = words.pop();
      return `${esc(words.join(' '))} <span>${esc(last)}</span>`;
    }

    function renderFacts(p, s, settings) {
      const factData = [
        ['Current Role', p.title],
        ['Location', p.location],
        ['Affiliation', s.institution || p.company],
        ['Degree / Major', s.course ? `${s.course}${s.specialization ? ` (${s.specialization})` : ''}` : ''],
        ['Graduation', s.graduationYear],
        ['Academic Merit', s.gpa],
        ['Focus Objective', settings.goal]
      ].filter(x => x[1]);

      return factData.map(x => `
        <div class="fact">
          <small>${esc(x[0])}</small>
          <strong>${esc(x[1])}</strong>
        </div>`).join('');
    }

    function renderStudentSection(s, a) {
      const studentCards = [];
      if (s.course || s.institution) {
        studentCards.push(`
          <article class="student-card wide">
            <small>Current Education</small>
            <h3>${esc(s.course || 'Academic Program')}</h3>
            <p>${esc([s.specialization, s.institution, s.studyYear, s.graduationYear ? `Expected: ${s.graduationYear}` : ''].filter(Boolean).join(' · '))}</p>
          </article>`);
      }
      if ((a.achievements || []).length) {
        studentCards.push(`
          <article class="student-card">
            <small>Key Achievements</small>
            <ul class="clean-list">
              ${a.achievements.map(x => `<li>${esc(x)}</li>`).join('')}
            </ul>
          </article>`);
      }
      if ((a.certifications || []).length) {
        studentCards.push(`
          <article class="student-card">
            <small>Certifications</small>
            <ul class="clean-list">
              ${a.certifications.map(x => `<li>${esc(x)}</li>`).join('')}
            </ul>
          </article>`);
      }
      if ((a.languages || []).length) {
        studentCards.push(`
          <article class="student-card">
            <small>Languages</small>
            <h3>${esc(a.languages.join(' · '))}</h3>
          </article>`);
      }
      if ((a.interests || []).length) {
        studentCards.push(`
          <article class="student-card wide">
            <small>Areas of Interest</small>
            <h3>${esc(a.interests.join(' · '))}</h3>
          </article>`);
      }

      if (!studentCards.length) return '';

      return `
        <section id="studentSection">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="section-label">Profile Highlights</div>
                <h2>Education & Qualifications</h2>
              </div>
              <p>Credentials, achievements, and academic background.</p>
            </div>
            <div class="student-grid">
              ${studentCards.join('')}
            </div>
          </div>
        </section>`;
    }

    function renderExperienceSection(exp, edu) {
      const journey = [
        ...exp.map(x => ({
          title: x.title,
          org: x.company,
          date: dateRange(x.startDate, x.endDate),
          description: x.description
        })),
        ...edu.map(x => ({
          title: x.degree,
          org: [x.fieldOfStudy, x.school, x.gpa].filter(Boolean).join(' · '),
          date: dateRange(x.startDate, x.endDate) || 'Education',
          description: ''
        }))
      ].filter(x => x.title);

      if (!journey.length) return '';

      return `
        <section id="experience">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="section-label">Journey</div>
                <h2>Experience & Background</h2>
              </div>
              <p>Positions held, academic credentials, and measurable impact.</p>
            </div>
            <div class="timeline">
              ${journey.map(x => `
                <article class="role">
                  <h3>${esc(x.title)}</h3>
                  <div class="role-meta">${esc([x.org, x.date].filter(Boolean).join(' · '))}</div>
                  ${x.description ? `<p>${esc(x.description)}</p>` : ''}
                </article>`).join('')}
            </div>
          </div>
        </section>`;
    }

    function renderSocials(p) {
      const links = [
        ['Email', p.email ? `mailto:${p.email}` : ''],
        ['LinkedIn', safeUrl(p.linkedin)],
        ['GitHub', safeUrl(p.github)],
        ['Phone', p.phone ? `tel:${p.phone}` : '']
      ].filter(x => x[1]);

      return links.map(x => `
        <a href="${esc(x[1])}" ${x[0] === 'LinkedIn' || x[0] === 'GitHub' ? 'target="_blank" rel="noopener"' : ''}>
          ${esc(x[0])}
        </a>`).join('');
    }

    // Initialize
    loadPortfolio();
  </script>
</body>
</html>
